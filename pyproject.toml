[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: talks to real Qdrant/Groq services; skipped unless explicitly selected",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
